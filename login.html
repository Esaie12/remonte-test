<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — RemontTest</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">

      <!-- Logo -->
      <a href="index.html" class="auth-logo">
        <span class="brand-icon"><i class="bi bi-check2-circle"></i></span>
        RemontTest
      </a>

      <h4 style="font-weight:700;color:#1e293b;margin-bottom:4px;">Bon retour !</h4>
      <p class="text-muted mb-4" style="font-size:.875rem;">Connectez-vous à votre espace.</p>

      <!-- Form -->
      <form novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Adresse e-mail</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0">
              <i class="bi bi-envelope text-muted"></i>
            </span>
            <input id="email" type="email" class="form-control border-start-0 ps-0"
                   placeholder="vous@exemple.com" required />
          </div>
        </div>

        <div class="mb-1">
          <label class="form-label" for="password">Mot de passe</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0">
              <i class="bi bi-lock text-muted"></i>
            </span>
            <input id="password" type="password" class="form-control border-start-0 ps-0"
                   placeholder="••••••••" required />
            <button type="button" class="input-group-text bg-light" style="cursor:pointer;">
              <i class="bi bi-eye text-muted"></i>
            </button>
          </div>
        </div>

        <div class="d-flex justify-content-end mb-3">
          <a href="#" style="font-size:.8rem;">Mot de passe oublié ?</a>
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="remember" />
          <label class="form-check-label" for="remember" style="font-size:.875rem;">Se souvenir de moi</label>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2">
          <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
        </button>

        <div class="my-4 d-flex align-items-center gap-2">
          <hr class="flex-grow-1 m-0" />
          <span class="text-muted" style="font-size:.8rem;white-space:nowrap;">ou continuer avec</span>
          <hr class="flex-grow-1 m-0" />
        </div>

        <div class="d-grid gap-2">
          <button type="button" class="btn btn-outline-secondary">
            <i class="bi bi-google me-2"></i>Google
          </button>
          <button type="button" class="btn btn-outline-secondary">
            <i class="bi bi-github me-2"></i>GitHub
          </button>
        </div>
      </form>

      <p class="text-center mt-4 mb-0" style="font-size:.875rem;">
        Pas encore de compte ?
        <a href="register.html">S'inscrire</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
