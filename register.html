<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription — RemontTest</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card" style="max-width:500px;">

      <!-- Logo -->
      <a href="index.html" class="auth-logo">
        <span class="brand-icon"><i class="bi bi-check2-circle"></i></span>
        RemontTest
      </a>

      <h4 style="font-weight:700;color:#1e293b;margin-bottom:4px;">Créer un compte</h4>
      <p class="text-muted mb-4" style="font-size:.875rem;">Démarrez votre essai gratuit de 14 jours.</p>

      <!-- Form -->
      <form novalidate>
        <div class="row g-3 mb-3">
          <div class="col-6">
            <label class="form-label" for="firstname">Prénom</label>
            <input id="firstname" type="text" class="form-control" placeholder="Marie" required />
          </div>
          <div class="col-6">
            <label class="form-label" for="lastname">Nom</label>
            <input id="lastname" type="text" class="form-control" placeholder="Dupont" required />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="email">Adresse e-mail</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0">
              <i class="bi bi-envelope text-muted"></i>
            </span>
            <input id="email" type="email" class="form-control border-start-0 ps-0"
                   placeholder="vous@exemple.com" required />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="company">Société / Structure <span class="text-muted">(optionnel)</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0">
              <i class="bi bi-building text-muted"></i>
            </span>
            <input id="company" type="text" class="form-control border-start-0 ps-0"
                   placeholder="Acme Agency" />
          </div>
        </div>

        <div class="mb-1">
          <label class="form-label" for="password">Mot de passe</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0">
              <i class="bi bi-lock text-muted"></i>
            </span>
            <input id="password" type="password" class="form-control border-start-0 ps-0"
                   placeholder="••••••••" required />
            <button type="button" class="input-group-text bg-light" style="cursor:pointer;">
              <i class="bi bi-eye text-muted"></i>
            </button>
          </div>
        </div>
        <!-- Password strength indicator -->
        <div class="mb-3">
          <div class="progress progress-thin mt-2">
            <div class="progress-bar bg-success" style="width:60%;"></div>
          </div>
          <small class="text-muted">Robustesse : <span style="color:#10b981;">Bonne</span></small>
        </div>

        <div class="mb-3">
          <label class="form-label" for="password2">Confirmer le mot de passe</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0">
              <i class="bi bi-lock-fill text-muted"></i>
            </span>
            <input id="password2" type="password" class="form-control border-start-0 ps-0"
                   placeholder="••••••••" required />
          </div>
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="cgu" required />
          <label class="form-check-label" for="cgu" style="font-size:.875rem;">
            J'accepte les <a href="#">Conditions générales</a> et la <a href="#">Politique de confidentialité</a>
          </label>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2">
          <i class="bi bi-person-plus me-2"></i>Créer mon compte
        </button>

        <div class="my-4 d-flex align-items-center gap-2">
          <hr class="flex-grow-1 m-0" />
          <span class="text-muted" style="font-size:.8rem;white-space:nowrap;">ou s'inscrire avec</span>
          <hr class="flex-grow-1 m-0" />
        </div>

        <div class="d-grid gap-2">
          <button type="button" class="btn btn-outline-secondary">
            <i class="bi bi-google me-2"></i>Google
          </button>
          <button type="button" class="btn btn-outline-secondary">
            <i class="bi bi-github me-2"></i>GitHub
          </button>
        </div>
      </form>

      <p class="text-center mt-4 mb-0" style="font-size:.875rem;">
        Déjà un compte ?
        <a href="login.html">Se connecter</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
